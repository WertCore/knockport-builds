name: release

# Builds KnockPort for four targets from runners that can each build natively.
# Cross-compiling a Tauri app is not a flag: every platform needs its own
# webview, linker and bundler, which is exactly what a laptop cannot provide
# and a matrix can.
#
# Runs here rather than beside the source because Actions minutes are
# billed to the repository running the workflow. The source is checked out from
# there with a read-only token and never lands in this repository.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag in wertcore/knockport (Bitbucket) to build (e.g. v0.1.0)"
        required: true
      targets:
        description: "all, none, or a comma-separated subset of macos-arm64, macos-x64, windows-x64, linux-x64"
        default: all
      reuse_from_run:
        description: "Comma-separated run IDs whose bundles to publish alongside this build's (empty for none)"
        default: ""
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

jobs:
  # Rebuilding four targets to fix one costs ~200 billable minutes at the macOS
  # 10x multiplier. `targets` narrows the matrix and `reuse_from_run` supplies
  # the bundles this run did not build, so fixing one platform costs one job.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - name: Pick the matrix
        id: pick
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          # ubuntu 22.04 and not 24.04 on purpose: the glibc an AppImage is
          # linked against is the OLDEST it will run on, so building on the
          # newer image silently drops everyone still on 22.04.
          all='[
            {"runner":"macos-15",       "label":"macos-arm64",  "args":"--target aarch64-apple-darwin"},
            {"runner":"macos-15-intel", "label":"macos-x64",    "args":"--target x86_64-apple-darwin"},
            {"runner":"windows-latest", "label":"windows-x64",  "args":""},
            {"runner":"ubuntu-22.04",   "label":"linux-x64",    "args":""}
          ]'
          if [ "$TARGETS" = "none" ] || [ -z "$TARGETS" ]; then
            # Every bundle already exists somewhere in reuse_from_run, so this
            # run only has to publish. One ubuntu minute instead of four builds.
            picked='[]'
          elif [ "$TARGETS" = "all" ]; then
            picked=$(jq -c . <<<"$all")
          else
            picked=$(jq -c --arg t "$TARGETS" '
              ($t | split(",") | map(gsub("^ +| +$"; ""))) as $want
              | map(select(.label as $l | $want | index($l) != null))
            ' <<<"$all")
            # Empty AFTER a real request is a typo, not a publish-only run.
            # Failing here costs one ubuntu minute; failing later costs the
            # reader an hour working out why the job never appeared.
            if [ "$(jq length <<<"$picked")" -eq 0 ]; then
              echo "::error::No target matches '$TARGETS'. Valid: all, none, macos-arm64, macos-x64, windows-x64, linux-x64."
              exit 1
            fi
          fi
          if [ "$(jq length <<<"$picked")" -eq 0 ]; then
            echo "Building nothing; publishing what reuse_from_run already holds."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building: $(jq -r 'map(.label) | join(", ")' <<<"$picked")"
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # Guarding the job, not the matrix: an `include:` that expands to nothing
    # fails the run outright rather than skipping.
    if: needs.plan.outputs.any == 'true'
    strategy:
      # One broken target should not deny you the other three. A macOS build
      # failing at 3am must still leave Windows and Linux downloadable.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    steps:
      # A clone, not actions/checkout: the source lives in Bitbucket now, and
      # actions/checkout only speaks to GitHub. Building straight from Bitbucket
      # is what removes the need to keep GitHub in step at all — there is no
      # mirror, and a release does not wait on one.
      #
      # x-token-auth is the username Bitbucket expects for token auth over
      # https. The email cannot be used here: its `@` makes git read the host
      # as the part after it and the token as a port number.
      - name: Check out the product source from Bitbucket
        shell: bash
        env:
          BB_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch "${{ inputs.tag }}" \
            "https://x-token-auth:${BB_TOKEN}@bitbucket.org/wertcore/knockport.git" . \
            || { echo "::error::could not clone ${{ inputs.tag }} from wertcore/knockport — does the tag exist on Bitbucket?"; exit 1; }
          # The url carries a credential; drop it so nothing later can leak or
          # reuse it, and so a stray push cannot reach Bitbucket from a runner.
          git remote remove origin
          echo "checked out $(git rev-parse --short HEAD) from Bitbucket"

      - name: Linux build dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.label == 'macos-arm64' && 'aarch64-apple-darwin' || matrix.label == 'macos-x64' && 'x86_64-apple-darwin' || '' }}

      # Keyed on the lockfile AND the target: one cache shared across targets
      # would thrash, each build evicting the last.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.label }}

      # No `version:`. The repo declares packageManager in package.json and
      # this action refuses both at once — which is right: two places naming a
      # version is two places to disagree.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Signing is opt-in: with no certificate configured the build still
      # produces an unsigned bundle rather than failing, which is what a test
      # build wants. The variables are exported only when there IS one, so the
      # bundler is never handed an empty certificate to import — and the
      # warning says plainly what an unsigned macOS build means for whoever
      # downloads it.
      - name: macOS signing environment
        if: startsWith(matrix.runner, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set — this macOS bundle will be unsigned, and Gatekeeper refuses an unsigned app with \"the app is damaged\" rather than a prompt."
            exit 0
          fi
          missing=""
          for v in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          # Half-configured signing is worse than none: the bundle gets signed,
          # notarisation is skipped, and Gatekeeper still rejects it — with the
          # build green and nothing saying why.
          if [ -n "$missing" ]; then
            echo "::error::A certificate is configured but these are missing:$missing"
            exit 1
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done
          echo "signing as $APPLE_SIGNING_IDENTITY, notarising with team $APPLE_TEAM_ID"

      - name: Build
        working-directory: apps/desktop
        env:
          # Signs the bundle for the updater and writes a .sig beside it.
          # Without these the build succeeds and produces artifacts the app
          # will refuse to install, which is the worst of both outcomes.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Literally empty, because the key was generated without a password.
          # It cannot come from a secret: GitHub refuses to store an empty
          # value, and a space is a PASSWORD — Tauri tries to decrypt with it
          # and fails, which is exactly how this broke the first time.
          # An absent password is not a secret, so it does not want hiding.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Vite inlines this at BUILD time. It reaches a developer through a
          # gitignored apps/web/.env, which by definition cannot reach a CI
          # checkout — so every release built here shipped with the endpoint
          # undefined, and reportInstall returned "skipped" on its first line
          # without ever making a request. A variable rather than a secret: it
          # is compiled into the bundle and readable by anyone holding the app,
          # so masking it in the log would protect nothing.
          VITE_TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
          # Identity, same story as telemetry: Vite inlines these at BUILD
          # time and they reached a developer only through a gitignored
          # apps/web/.env, so every release so far shipped with auth switched
          # off and said so on the button. Variables rather than secrets —
          # an issuer, a client id and a public API base are all compiled into
          # the bundle and readable by anyone holding the app.
          VITE_IDENTITY_URL: ${{ vars.VITE_IDENTITY_URL }}
          VITE_OIDC_ISSUER: ${{ vars.VITE_OIDC_ISSUER }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
        run: |
          bash scripts/fetch-engine.sh
          pnpm exec tauri build --config src-tauri/tauri.bundle.conf.json ${{ matrix.args }}
        shell: bash

      - name: Collect the bundles
        shell: bash
        run: |
          mkdir -p out
          # -print0/-d '' so a path with a space cannot split into two.
          find target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -print0 | while IFS= read -r -d '' f; do cp "$f" out/; done
          # Both macOS arches call the updater bundle KnockPort.app.tar.gz, and
          # a release names its assets by basename alone — so the second one
          # uploaded overwrites or rejects the first. The target label is the
          # only thing that tells them apart.
          for f in out/KnockPort.app.tar.gz out/KnockPort.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            mv "$f" "out/KnockPort_${{ matrix.label }}.${f#out/KnockPort.}"
          done
          ls -la out/

      - uses: actions/upload-artifact@v7
        with:
          name: knockport-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    # `always()` so three good targets still publish when a fourth failed —
    # `needs` alone would skip this entirely.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # The release is cut in another repository with RELEASE_TOKEN, so nothing
      # here needs write. actions:read is for pulling an earlier run's bundles.
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist }

      # Artifacts outlive their run by 90 days, so a one-target rebuild can
      # still publish a complete set rather than rebuilding the other three.
      # gh rather than download-artifact: the action takes a single run-id, and
      # a set assembled over several fixes comes from several runs.
      - name: Bundles from earlier runs
        if: inputs.reuse_from_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUNS: ${{ inputs.reuse_from_run }}
        run: |
          for id in ${RUNS//,/ }; do
            [ -n "$id" ] || continue
            echo "::group::Bundles from run $id"
            gh run download "$id" --dir "dist/run-$id"
            echo "::endgroup::"
          done

      - name: Publish
        env:
          # Not SOURCE_TOKEN: that one is Contents:read on the product repo by
          # design, and creating a release needs write. Not GITHUB_TOKEN
          # either, which cannot reach outside this repository.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # A public repository holding nothing but releases, so these URLs
          # work for a stranger while this pipeline and its logs stay private.
          # Set explicitly because there is no checkout in this job for gh to
          # infer a repository from — which is how the first attempt died.
          GH_REPO: WertCore/knockport-releases
          TAG: ${{ inputs.tag }}
        run: |
          # Said plainly here, because the alternative is a 403 from an API URL
          # that names no cause, after every build has already been paid for.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. It needs Contents: write on $GH_REPO."
            exit 1
          fi
          mkdir -p dist
          # -print0 into an array: a bundle name with a space is one file, not
          # two arguments.
          mapfile -t -d '' found < <(find dist -type f -print0)
          # A .sig whose payload was not collected signs nothing anyone can
          # check. Publishing it invites a downloader to verify a file that is
          # not there.
          files=()
          for f in "${found[@]}"; do
            if [ "${f%.sig}" != "$f" ] && [ ! -e "${f%.sig}" ]; then
              echo "skip ${f##*/}: signs a bundle this release does not carry"
              continue
            fi
            files+=("$f")
          done
          # Nothing to publish means every target failed, and those jobs are
          # already red. Failing again here adds a second red mark carrying no
          # information a reader did not already have.
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bundles were produced — every build target failed."
            echo "The failure is in those jobs, not here."
            exit 0
          fi
          # Assets live in one flat namespace per release, so a duplicate
          # basename fails mid-upload with a 404 that names no cause. Say it
          # here, before anything has been uploaded.
          dupes=$(printf '%s\n' "${files[@]##*/}" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Two targets produced the same asset name: $(echo $dupes | tr '\n' ' ')"
            exit 1
          fi
          printf '%s\n' "${files[@]}" | sort
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running one target adds its bundle to the release that already
            # exists, rather than failing because the tag is taken.
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "KnockPort $TAG" \
              --notes "Desktop builds for macOS (Apple silicon and Intel), Windows and Linux." \
              ${{ inputs.draft && '--draft' || '' }}
          fi

name: release

# Builds KnockPort for four targets from runners that can each build natively.
# Cross-compiling a Tauri app is not a flag: every platform needs its own
# webview, linker and bundler, which is exactly what a laptop cannot provide
# and a matrix can.
#
# Runs here rather than in transmitworks/knockport because Actions minutes are
# billed to the repository running the workflow. The source is checked out from
# there with a read-only token and never lands in this repository.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag in transmitworks/knockport to build (e.g. v0.1.0)"
        required: true
      targets:
        description: "all, or a comma-separated subset of macos-arm64, macos-x64, windows-x64, linux-x64"
        default: all
      reuse_from_run:
        description: "Run ID whose bundles to publish alongside this build's (empty for none)"
        default: ""
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

jobs:
  # Rebuilding four targets to fix one costs ~200 billable minutes at the macOS
  # 10x multiplier. `targets` narrows the matrix and `reuse_from_run` supplies
  # the bundles this run did not build, so fixing one platform costs one job.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the matrix
        id: pick
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          # ubuntu 22.04 and not 24.04 on purpose: the glibc an AppImage is
          # linked against is the OLDEST it will run on, so building on the
          # newer image silently drops everyone still on 22.04.
          all='[
            {"runner":"macos-15",       "label":"macos-arm64",  "args":"--target aarch64-apple-darwin"},
            {"runner":"macos-15-intel", "label":"macos-x64",    "args":"--target x86_64-apple-darwin"},
            {"runner":"windows-latest", "label":"windows-x64",  "args":""},
            {"runner":"ubuntu-22.04",   "label":"linux-x64",    "args":""}
          ]'
          if [ "$TARGETS" = "all" ]; then
            picked=$(jq -c . <<<"$all")
          else
            picked=$(jq -c --arg t "$TARGETS" '
              ($t | split(",") | map(gsub("^ +| +$"; ""))) as $want
              | map(select(.label as $l | $want | index($l) != null))
            ' <<<"$all")
          fi
          # An empty matrix is a typo in the input, not a build with nothing to
          # do. Failing here costs one ubuntu minute; failing later costs the
          # reader an hour working out why four jobs never appeared.
          if [ "$(jq length <<<"$picked")" -eq 0 ]; then
            echo "::error::No target matches '$TARGETS'. Valid: macos-arm64, macos-x64, windows-x64, linux-x64."
            exit 1
          fi
          echo "Building: $(jq -r 'map(.label) | join(", ")' <<<"$picked")"
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      # One broken target should not deny you the other three. A macOS build
      # failing at 3am must still leave Windows and Linux downloadable.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the product source
        uses: actions/checkout@v5
        with:
          repository: transmitworks/knockport
          ref: ${{ inputs.tag }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Linux build dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.label == 'macos-arm64' && 'aarch64-apple-darwin' || matrix.label == 'macos-x64' && 'x86_64-apple-darwin' || '' }}

      # Keyed on the lockfile AND the target: one cache shared across targets
      # would thrash, each build evicting the last.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.label }}

      # No `version:`. The repo declares packageManager in package.json and
      # this action refuses both at once — which is right: two places naming a
      # version is two places to disagree.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/desktop
        env:
          # Signs the bundle for the updater and writes a .sig beside it.
          # Without these the build succeeds and produces artifacts the app
          # will refuse to install, which is the worst of both outcomes.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Literally empty, because the key was generated without a password.
          # It cannot come from a secret: GitHub refuses to store an empty
          # value, and a space is a PASSWORD — Tauri tries to decrypt with it
          # and fails, which is exactly how this broke the first time.
          # An absent password is not a secret, so it does not want hiding.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          bash scripts/fetch-engine.sh
          pnpm exec tauri build --config src-tauri/tauri.bundle.conf.json ${{ matrix.args }}
        shell: bash

      - name: Collect the bundles
        shell: bash
        run: |
          mkdir -p out
          # -print0/-d '' so a path with a space cannot split into two.
          find target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.sig' \) \
            -print0 | while IFS= read -r -d '' f; do cp "$f" out/; done
          ls -la out/

      - uses: actions/upload-artifact@v7
        with:
          name: knockport-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    # `always()` so three good targets still publish when a fourth failed —
    # `needs` alone would skip this entirely.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # Enough to cut a release here, and to read an earlier run's artifacts.
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist }

      # Artifacts outlive their run by 90 days, so a one-target rebuild can
      # still publish a complete set rather than rebuilding the other three.
      - name: Bundles from an earlier run
        if: inputs.reuse_from_run != ''
        uses: actions/download-artifact@v8
        with:
          path: dist
          run-id: ${{ inputs.reuse_from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        env:
          # Not SOURCE_TOKEN. That one is Contents:read on the product repo by
          # design, and creating a release needs write — which is why this used
          # to fail with a 403. The release lives here instead, where the
          # built-in token suffices and the build service still cannot write to
          # the source.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          # -print0 into an array: a bundle name with a space is one file, not
          # two arguments.
          mapfile -t -d '' files < <(find dist -type f -print0)
          # Nothing to publish means every target failed, and those jobs are
          # already red. Failing again here adds a second red mark carrying no
          # information a reader did not already have.
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bundles were produced — every build target failed."
            echo "The failure is in those jobs, not here."
            exit 0
          fi
          printf '%s\n' "${files[@]}" | sort
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running one target adds its bundle to the release that already
            # exists, rather than failing because the tag is taken.
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --target "${{ github.sha }}" \
              --title "KnockPort $TAG" \
              --notes "Desktop builds for macOS (Apple silicon and Intel), Windows and Linux." \
              ${{ inputs.draft && '--draft' || '' }}
          fi
